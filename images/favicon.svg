<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0a58ca" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198754" />
      <stop offset="100%" stop-color="#146c43" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />

  <!-- Microphone Symbol -->
  <g transform="translate(0, -10)">
    <!-- Capsule -->
    <rect x="206" y="110" width="100" height="170" rx="50" fill="#ffffff" />
    
    <!-- Outer Arc / Stand -->
    <path d="M 156 220 C 156 310, 356 310, 356 220" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Base Stem -->
    <line x1="256" y1="298" x2="256" y2="355" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <line x1="196" y1="355" x2="316" y2="355" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- Checkmark Badge (Bottom Right) -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="360" r="90" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="16" />
    <path d="M 315 360 L 348 393 L 410 327" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
